<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽水音乐 - 声波粒子交互</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background-color: #02050A; color: #ffffff; overflow: hidden; }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(2,5,10,1) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 60px 40px 60px;
            pointer-events: none;
        }

        .app-container > * { pointer-events: auto; }

        header { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo svg { height: 32px; }
        .logo span { background: #fff; color: #000; font-size: 12px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 30px; font-size: 15px; color: rgba(255, 255, 255, 0.8); }
        .nav-right a { color: inherit; text-decoration: none; transition: color 0.3s; }
        .nav-right a:hover { color: #fff; }
        .nav-icons { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background-image: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'); background-size: cover; border: 2px solid rgba(255,255,255,0.2);}

        main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 50px; }
        .hero-title { font-size: 72px; font-weight: 800; line-height: 1.2; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .login-btn { background: #ffffff; color: #000000; font-size: 20px; font-weight: bold; padding: 15px 60px; border-radius: 40px; border: none; cursor: pointer; width: fit-content; margin-bottom: 30px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3); }
        .platforms { font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        .platforms-icons { display: flex; gap: 15px; margin-top: 10px; font-size: 24px; color: #fff; }

        .cards-wrapper { display: flex; gap: 30px; width: 100%; max-width: 1000px; }
        .glass-card { flex: 1; background: linear-gradient(135deg, rgba(16, 50, 25, 0.3) 0%, rgba(8, 25, 12, 0.4) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 35px 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); transition: transform 0.3s ease, border-color 0.3s; }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(0, 255, 65, 0.5); }
        .card-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .card-subtitle { font-size: 13px; color: rgba(255, 255, 255, 0.7); margin-bottom: 25px; }
        .card-list { list-style: none; }
        .card-list li { display: flex; align-items: center; font-size: 14px; color: rgba(255, 255, 255, 0.9); margin-bottom: 12px; }
        .card-list li::before { content: '✓'; display: inline-flex; justify-content: center; align-items: center; width: 16px; height: 16px; background: rgba(255, 255, 255, 0.8); color: #08200f; border-radius: 50%; font-size: 10px; font-weight: bold; margin-right: 12px; }

        #error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 50, 50, 0.9);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 100;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .app-container { padding: 20px 20px 40px 20px; }
            .hero-title { font-size: 42px; }
            .cards-wrapper { flex-direction: column; }
            .nav-right { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-container"></canvas>
    <div class="vignette"></div>
    <div id="error-message"></div>

    <div class="app-container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 8C24 8 14 14 14 26C14 32 16.5 36 20 38.5V14H24V40C24 40 28 38 30 34C32 30 32 20 32 12H36C36 24 28 34 24 34C20 34 18 30 18 26C18 20 22 16 24 16V8Z" fill="#00FF41"/>
                    <path d="M36 12V8C36 8 40 10 40 14V40C40 40 36 38 36 34V12Z" fill="#FFFFFF"/>
                </svg>
                <span>合作平台</span>
            </div>
            <div class="nav-right">
                <a href="#">创作实验室</a>
                <a href="#">汽水音乐</a>
                <div class="nav-icons">
                    <span style="font-size: 20px; cursor: pointer;">🎧</span>
                    <div style="position:relative; cursor:pointer;">🔔<span style="position:absolute; top:-5px; right:-8px; background:red; color:white; font-size:10px; padding:2px 4px; border-radius:10px;">99+</span></div>
                    <div class="avatar"></div>
                </div>
            </div>
        </header>
        <main>
            <h1 class="hero-title">亿万观众期待着<br>看见你的音乐</h1>
            <button class="login-btn">登录/注册</button>
            <div class="platforms">
                <p>作品一站发行全球平台</p>
                <div class="platforms-icons">
                    <span>🎵</span>
                    <span>🎶</span>
                    <span>📱</span>
                    <span>🌍</span>
                </div>
            </div>
        </main>
        <footer class="cards-wrapper">
            <div class="glass-card">
                <div class="card-title">歌曲合作</div>
                <div class="card-subtitle">合作全面升级，授权解锁更高分成比例</div>
                <ul class="card-list">
                    <li>授权歌曲得抖音应用及全网高分成比例</li>
                    <li>优质歌曲带动用户付费额外获得更高收益</li>
                    <li>授权全网代理可解锁更高分成比例</li>
                    <li>合作全面升级，授权解锁更高分成比例</li>
                </ul>
            </div>
            <div class="glass-card">
                <div class="card-title">歌曲宣推</div>
                <div class="card-subtitle">平台加码流量助力音乐</div>
                <ul class="card-list">
                    <li>精准触达，为新歌出圈提供长效流量引擎</li>
                    <li>高效转化，为推歌提供无缝转化流程</li>
                    <li>全面覆盖，为推广提供全周期全人群服务</li>
                    <li>高效转化，为推歌提供无缝转化流程</li>
                </ul>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        const errorEl = document.getElementById('error-message');
        
        let particles = [];
        let mouseX = 0, mouseY = 0;
        let isMouseOver = false;
        let time = 0;

        // 图片路径配置 - 在这里替换您的图片路径
        const BACKGROUND_IMAGE_PATH = './input_file_1.jpeg';
        
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };

        const showError = (message) => {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            console.error(message);
        };

        const createSoundWaveParticles = () => {
            particles = [];
            const cols = Math.floor(canvas.width / 4);
            const rows = Math.floor(canvas.height / 4);
            
            for(let y = 0; y < rows; y++) {
                for(let x = 0; x < cols; x++) {
                    const px = (x + 0.5) * (canvas.width / cols);
                    const py = (y + 0.5) * (canvas.height / rows);
                    
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    const dx = px - centerX;
                    const dy = py - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    const baseRadius = Math.min(canvas.width, canvas.height) * 0.35;
                    const ripple1 = Math.sin(dist * 0.02) * 20;
                    const ripple2 = Math.sin(dist * 0.035) * 10;
                    const ripple3 = Math.sin(dist * 0.05) * 5;
                    const wave = ripple1 + ripple2 + ripple3;
                    
                    const effectiveDist = dist + wave * 0.3;
                    const brightness = effectiveDist < baseRadius 
                        ? 0.3 + (1 - effectiveDist / baseRadius) * 0.7 
                        : Math.max(0.05, 0.4 - (effectiveDist - baseRadius) * 0.003);
                    
                    if(brightness > 0.08) {
                        particles.push({
                            x: px,
                            y: py,
                            baseBrightness: brightness,
                            size: 1 + brightness * 2,
                            phase: Math.random() * Math.PI * 2,
                            r: 30 + Math.floor(brightness * 80),
                            g: 60 + Math.floor(brightness * 195),
                            b: 20 + Math.floor(brightness * 60)
                        });
                    }
                }
            }
        };

        const initParticlesFromImage = (image) => {
            particles = [];
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            const maxResolution = 280;
            const aspectRatio = image.width / image.height;
            let tempWidth, tempHeight;
            
            if(aspectRatio > 1) {
                tempWidth = maxResolution;
                tempHeight = Math.floor(maxResolution / aspectRatio);
            } else {
                tempHeight = maxResolution;
                tempWidth = Math.floor(maxResolution * aspectRatio);
            }
            
            tempCanvas.width = tempWidth;
            tempCanvas.height = tempHeight;
            tempCtx.drawImage(image, 0, 0, tempWidth, tempHeight);
            
            const imageData = tempCtx.getImageData(0, 0, tempWidth, tempHeight);
            const data = imageData.data;
            
            const scaleX = canvas.width / tempWidth;
            const scaleY = canvas.height / tempHeight;
            
            for(let y = 0; y < tempHeight; y++) {
                for(let x = 0; x < tempWidth; x++) {
                    const index = (y * tempWidth + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];
                    
                    const brightness = (r + g + b) / (3 * 255);
                    
                    if(a > 50 && brightness > 0.05) {
                        const px = x * scaleX;
                        const py = y * scaleY;
                        
                        particles.push({
                            x: px,
                            y: py,
                            baseBrightness: brightness,
                            size: 1 + brightness * 2,
                            phase: Math.random() * Math.PI * 2,
                            r: r,
                            g: g,
                            b: b
                        });
                    }
                }
            }
        };

        const drawParticle = (p, time) => {
            const dx = p.x - mouseX;
            const dy = p.y - mouseY;
            const distToMouse = Math.sqrt(dx * dx + dy * dy);
            
            const hoverRadius = 200;
            let mouseInfluence = 0;
            
            if(isMouseOver && distToMouse < hoverRadius) {
                mouseInfluence = 1 - (distToMouse / hoverRadius);
                mouseInfluence = mouseInfluence * mouseInfluence;
            }
            
            const pulse = Math.sin(time * 2 + p.phase) * 0.3;
            const brightness = p.baseBrightness + mouseInfluence * 0.5 + pulse * 0.2;
            const finalBrightness = Math.min(1, brightness);
            
            const glowSize = p.size * (1 + mouseInfluence * 2);
            const alpha = 0.4 + finalBrightness * 0.6;
            
            const r = Math.min(255, Math.floor(p.r * (1 + mouseInfluence * 0.5)));
            const g = Math.min(255, Math.floor(p.g * (1 + mouseInfluence * 0.3)));
            const b = Math.min(255, Math.floor(p.b * (1 + mouseInfluence * 0.3)));
            
            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize * 3);
            gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
            gradient.addColorStop(0.3, `rgba(${Math.floor(r * 0.6)}, ${Math.floor(g * 0.8)}, ${Math.floor(b * 0.5)}, ${alpha * 0.5})`);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, glowSize * 3, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (1 + mouseInfluence), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${Math.min(255, r + 50)}, ${Math.min(255, g + 50)}, ${Math.min(255, b + 50)}, ${alpha})`;
            ctx.fill();
        };

        const drawRipples = () => {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for(let i = 0; i < 8; i++) {
                const baseRadius = 80 + i * 60;
                const wave = Math.sin(time * 1.5 + i * 0.5) * 15;
                const radius = baseRadius + wave;
                const alpha = (0.15 - i * 0.015) * (0.6 + Math.sin(time * 1.5 + i * 0.5) * 0.4);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(30, 200, 100, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        };

        const animate = () => {
            ctx.fillStyle = 'rgba(2, 5, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time += 0.016;
            drawRipples();
            
            particles.forEach(p => drawParticle(p, time));
            
            requestAnimationFrame(animate);
        };

        const loadImage = () => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = () => {
                console.log('图片加载成功!');
                initParticlesFromImage(img);
            };
            
            img.onerror = () => {
                console.log('无法加载图片，使用代码生成的声波效果');
                createSoundWaveParticles();
            };
            
            img.src = BACKGROUND_IMAGE_PATH;
        };

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isMouseOver = true;
        });

        canvas.addEventListener('mouseleave', () => {
            isMouseOver = false;
        });

        window.addEventListener('resize', () => {
            resize();
            loadImage();
        });
        
        resize();
        loadImage();
        animate();
    </script>
</body>
</html>
