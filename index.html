<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>田忌赛马 - Tian Ji's Horse Racing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- 主界面 -->
        <div id="main-screen" class="screen">
            <div class="decorative-circle circle-1"></div>
            <div class="decorative-circle circle-2"></div>
            <div class="decorative-triangle triangle-1"></div>
            <div class="decorative-triangle triangle-2"></div>
            
            <div class="gold-display">
                <span class="gold-icon">💰</span>
                <span class="gold-amount" id="main-gold">300</span>
            </div>
            
            <h1 class="game-title">田忌赛马</h1>
            <p class="game-subtitle">齐国大将被挑战！</p>
            
            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="Game.switchScreen('barn')">
                    <span class="btn-icon">🏠</span>
                    养马屋
                </button>
                <button class="btn btn-secondary" onclick="Game.switchScreen('shop')">
                    <span class="btn-icon">🛒</span>
                    商店
                </button>
                <button class="btn btn-warning" onclick="Game.switchScreen('race')">
                    <span class="btn-icon">🏁</span>
                    赛场
                </button>
            </div>
            
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">总比赛</span>
                    <span class="stat-value" id="total-races">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">胜率</span>
                    <span class="stat-value" id="win-rate">0%</span>
                </div>
            </div>
        </div>

        <!-- 养马屋界面 -->
        <div id="barn-screen" class="screen hidden">
            <div class="screen-header">
                <button class="btn-back" onclick="Game.switchScreen('main')">← 返回</button>
                <h2>养马屋</h2>
                <div class="gold-display small">
                    <span class="gold-icon">💰</span>
                    <span id="barn-gold">300</span>
                </div>
            </div>
            
            <div class="horse-slots" id="horse-slots">
                <!-- 马匹槽位将由JS生成 -->
            </div>
            
            <button class="btn btn-primary btn-large" onclick="Game.openHorseBuilder()">
                <span class="btn-icon">➕</span>
                新拼一匹马
            </button>
        </div>

        <!-- 拼马界面 -->
        <div id="builder-screen" class="screen hidden">
            <div class="screen-header">
                <button class="btn-back" onclick="Game.closeHorseBuilder()">← 返回</button>
                <h2>拼马大师</h2>
            </div>
            
            <div class="builder-container">
                <div class="horse-preview" id="horse-preview">
                    <div class="horse-name-input">
                        <input type="text" id="horse-name" placeholder="给马起个名字..." maxlength="10">
                    </div>
                    <div class="horse-display">
                        <div class="part-slot" data-part="head">
                            <span class="slot-label">头部</span>
                            <div class="slot-content empty" onclick="Game.openPartSelector('head')">?</div>
                        </div>
                        <div class="part-slot" data-part="body">
                            <span class="slot-label">身体</span>
                            <div class="slot-content empty" onclick="Game.openPartSelector('body')">?</div>
                        </div>
                        <div class="part-slot" data-part="legs">
                            <span class="slot-label">腿部</span>
                            <div class="slot-content empty" onclick="Game.openPartSelector('legs')">?</div>
                        </div>
                        <div class="part-slot" data-part="tail">
                            <span class="slot-label">尾巴</span>
                            <div class="slot-content empty" onclick="Game.openPartSelector('tail')">?</div>
                        </div>
                        <div class="part-slot" data-part="mane">
                            <span class="slot-label">鬃毛</span>
                            <div class="slot-content empty" onclick="Game.openPartSelector('mane')">?</div>
                        </div>
                    </div>
                </div>
                
                <div class="horse-stats-preview" id="horse-stats-preview">
                    <h3>属性预览</h3>
                    <div class="stat-bar">
                        <span class="stat-name">速度</span>
                        <div class="stat-bar-fill" id="stat-speed"><span class="stat-number">0</span></div>
                    </div>
                    <div class="stat-bar">
                        <span class="stat-name">加速</span>
                        <div class="stat-bar-fill" id="stat-acceleration"><span class="stat-number">0</span></div>
                    </div>
                    <div class="stat-bar">
                        <span class="stat-name">耐力</span>
                        <div class="stat-bar-fill" id="stat-stamina"><span class="stat-number">0</span></div>
                    </div>
                    <div class="stat-bar">
                        <span class="stat-name">魔法</span>
                        <div class="stat-bar-fill" id="stat-magic"><span class="stat-number">0</span></div>
                    </div>
                    <div class="total-score">
                        综合评分: <span id="total-score">0</span>
                    </div>
                </div>
                
                <div class="builder-actions">
                    <button class="btn btn-secondary" onclick="Game.openPartSelector('all')">
                        从背包选择
                    </button>
                    <button class="btn btn-primary" onclick="Game.saveHorse()" id="save-horse-btn" disabled>
                        保存马匹
                    </button>
                </div>
            </div>
        </div>

        <!-- 商店界面 -->
        <div id="shop-screen" class="screen hidden">
            <div class="screen-header">
                <button class="btn-back" onclick="Game.switchScreen('main')">← 返回</button>
                <h2>商店</h2>
                <div class="gold-display small">
                    <span class="gold-icon">💰</span>
                    <span id="shop-gold">300</span>
                </div>
            </div>
            
            <div class="shop-tabs">
                <button class="tab-btn active" data-type="all" onclick="Shop.filterType('all')">全部</button>
                <button class="tab-btn" data-type="head" onclick="Shop.filterType('head')">头部</button>
                <button class="tab-btn" data-type="body" onclick="Shop.filterType('body')">身体</button>
                <button class="tab-btn" data-type="legs" onclick="Shop.filterType('legs')">腿部</button>
                <button class="tab-btn" data-type="tail" onclick="Shop.filterType('tail')">尾巴</button>
                <button class="tab-btn" data-type="mane" onclick="Shop.filterType('mane')">鬃毛</button>
            </div>
            
            <div class="quality-filter">
                <button class="quality-btn" data-quality="all" onclick="Shop.filterQuality('all')">全部</button>
                <button class="quality-btn quality-common" data-quality="common" onclick="Shop.filterQuality('common')">普通</button>
                <button class="quality-btn quality-rare" data-quality="rare" onclick="Shop.filterQuality('rare')">稀有</button>
                <button class="quality-btn quality-epic" data-quality="epic" onclick="Shop.filterQuality('epic')">史诗</button>
                <button class="quality-btn quality-legendary" data-quality="legendary" onclick="Shop.filterQuality('legendary')">传说</button>
            </div>
            
            <div class="shop-items" id="shop-items">
                <!-- 商品将由JS生成 -->
            </div>
            
            <div class="inventory-section">
                <h3>背包</h3>
                <div class="inventory-items" id="inventory-items">
                    <!-- 背包物品将由JS生成 -->
                </div>
            </div>
        </div>

        <!-- 赛场界面 -->
        <div id="race-screen" class="screen hidden">
            <div class="screen-header">
                <button class="btn-back" onclick="Game.switchScreen('main')">← 返回</button>
                <h2>赛场</h2>
                <div class="gold-display small">
                    <span class="gold-icon">💰</span>
                    <span id="race-gold">300</span>
                </div>
            </div>
            
            <div class="race-fee-notice">
                <span>入场费: 💰50</span>
                <span>胜利奖励: 💰150</span>
            </div>
            
            <div class="select-horse-section" id="select-horse-section">
                <h3>选择你的赛马</h3>
                <div class="race-horse-list" id="race-horse-list">
                    <!-- 可参赛马匹列表将由JS生成 -->
                </div>
                
                <button class="btn btn-warning btn-large" onclick="Game.startRace()" id="start-race-btn" disabled>
                    开始比赛
                </button>
            </div>
            
            <div class="race-arena hidden" id="race-arena">
                <div class="race-track">
                    <div class="track-label">终点</div>
                    <div class="race-lane player-lane">
                        <div class="horse-name">你的马</div>
                        <div class="horse-sprite player-horse-sprite" id="player-horse"></div>
                        <div class="progress-track">
                            <div class="progress-fill player-progress" id="player-progress"></div>
                        </div>
                    </div>
                    <div class="race-lane opponent-lane">
                        <div class="horse-name">对手</div>
                        <div class="horse-sprite opponent-horse-sprite" id="opponent-horse"></div>
                        <div class="progress-track">
                            <div class="progress-fill opponent-progress" id="opponent-progress"></div>
                        </div>
                    </div>
                </div>
                
                <div class="race-score">
                    <div class="score-player">
                        <span>你</span>
                        <span id="player-score">0</span>
                    </div>
                    <div class="score-divider">:</div>
                    <div class="score-opponent">
                        <span>对手</span>
                        <span id="opponent-score">0</span>
                    </div>
                </div>
                
                <div class="race-round-info" id="race-round-info">
                    第 <span id="current-round">1</span> / 3 局
                </div>
                
                <div class="race-result hidden" id="race-result">
                    <h3 id="result-text"></h3>
                    <p id="result-gold"></p>
                    <button class="btn btn-primary" onclick="Game.exitRace()">返回赛场</button>
                </div>
            </div>
        </div>

        <!-- 部件选择弹窗 -->
        <div class="modal-overlay hidden" id="part-selector-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">选择部件</h3>
                    <button class="btn-close" onclick="Game.closePartSelector()">×</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- 部件选择列表将由JS生成 -->
                </div>
            </div>
        </div>

        <!-- 通知提示 -->
        <div class="notification-container" id="notifications"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
